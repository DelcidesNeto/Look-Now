name: look_now
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  buttons_tabbar: ^1.3.15
  material_symbols_icons: ^4.2815.1
  flutter_material_symbols: ^0.0.4
  fl_chart: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: MontSerratSemiBold
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
    - family: MontSerratRegular
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
